name: Validate desktop sharing review branch
on:
  push:
    branches: [ci/desktop-sharing-release-fixes-20261123]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:testing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends cmake build-essential ninja-build pkg-config \
            xorg-dev libx11-dev libxtst-dev libssl-dev libxkbfile-dev qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-svg-dev qt6-svg-plugins libxkbregistry-dev libxkbcommon-dev libei-dev \
            libportal-dev help2man
      - name: Configure, build and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=OFF -DUPDATE_TRANSLATIONS=OFF -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build --parallel 4
          ctest --test-dir build/src/unittests --parallel 2 --no-tests=error --output-on-failure
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Qt and locate OpenSSL
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $openssl = Join-Path $env:ProgramFiles 'OpenSSL'
          if (!(Test-Path "$openssl/include/openssl/ssl.h")) { throw 'OpenSSL SDK unavailable' }
          "QT_SDK=$env:RUNNER_TEMP/qt/6.10.3/msvc2022_64" >> $env:GITHUB_ENV
          "OPENSSL_SDK=$openssl" >> $env:GITHUB_ENV
      - name: Configure, build and test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:Path = "$env:QT_SDK/bin;$env:OPENSSL_SDK/bin;$env:Path"
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 -DBUILD_INSTALLER=OFF -DUPDATE_TRANSLATIONS=OFF -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON "-DCMAKE_PREFIX_PATH=$env:QT_SDK" "-DOPENSSL_ROOT_DIR=$env:OPENSSL_SDK"
          cmake --build build --config Release --parallel 4
          New-Item -ItemType Directory -Force 'build/src/translations' | Out-Null
          Copy-Item build/translations/*.qm 'build/src/translations'
          ctest --test-dir build/src/unittests -C Release --parallel 2 --no-tests=error --output-on-failure
