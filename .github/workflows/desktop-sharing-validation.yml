name: Linux profile regression
on:
  push:
    branches: [ci/desktop-sharing-validation]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:testing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends cmake build-essential ninja-build pkg-config \
            xorg-dev libx11-dev libxtst-dev libssl-dev libxkbfile-dev qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-svg-dev qt6-svg-plugins libxkbregistry-dev libxkbcommon-dev libei-dev \
            libportal-dev help2man
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=OFF -DUPDATE_TRANSLATIONS=OFF -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build --target CandidatePolicyTests --parallel 4
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/src/unittests -R '^CandidatePolicyTests$' --output-on-failure
