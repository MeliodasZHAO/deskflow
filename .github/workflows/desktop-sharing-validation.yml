name: Desktop sharing validation
on:
  push:
    branches: [ci/windows-reopen-validation-20261113]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true
      - name: Install upstream dependencies
        id: dependencies
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.10.3
          vcpkg-triplet: x64-windows-release
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
          disable_annotations: true
      - name: Configure
        id: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=OFF -DUPDATE_TRANSLATIONS=OFF -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ${{ steps.dependencies.outputs.vcpkg-cmake-config }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        if: always() && steps.configure.outcome == 'success'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/src/unittests --output-on-failure --parallel 2 --output-junit windows-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-test-results
          path: |
            build/src/unittests/Testing/Temporary/LastTest.log
            build/src/unittests/windows-results.xml
          if-no-files-found: ignore
